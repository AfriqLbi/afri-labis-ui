<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────────── -->
    <title>LÁBí — Aṣọ-Òkè & African Fashion | Ilorin, Nigeria</title>
    <meta
      name="description"
      content="LÁBí (Èwà Omoluabi) is an indigenous African textile and fashion brand from Ilorin, Nigeria. Modern Aṣọ-Òkè, FÌLÁ, ankara and contemporary African pieces worn with pride."
    />
    <meta
      name="keywords"
      content="LÁBí, Labi Africa, Aso-Oke, African fashion, Ankara, Nigerian fashion, Ilorin, African textiles, Asooke, contemporary African clothing, Kente, Adire, African prints"
    />
    <meta name="author" content="LÁBí — Èwà Omoluabi" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FED700" />
    <link rel="canonical" href="https://labiafrica.com/" />

    <!-- ── Open Graph ───────────────────────────────────────────────────────── -->
    <meta property="og:site_name" content="LÁBí" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://labiafrica.com/" />
    <meta property="og:title" content="LÁBí — Aṣọ-Òkè & African Fashion" />
    <meta
      property="og:description"
      content="Contemporary African fashion rooted in heritage craft. Handwoven Aṣọ-Òkè, FÌLÁ, and modern African pieces made in Ilorin, Nigeria — worn around the world."
    />
    <meta property="og:image" content="https://labiafrica.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="LÁBí — Contemporary African Fashion from Ilorin, Nigeria"
    />
    <meta property="og:locale" content="en_NG" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@labiiafrica" />
    <meta name="twitter:creator" content="@labiiafrica" />
    <meta name="twitter:title" content="LÁBí — Aṣọ-Òkè & African Fashion" />
    <meta
      name="twitter:description"
      content="Contemporary African fashion rooted in heritage craft. Handwoven Aṣọ-Òkè and modern African pieces made in Ilorin, Nigeria."
    />
    <meta name="twitter:image" content="https://labiafrica.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="LÁBí African Fashion" />

    <!-- ── Favicon ──────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Structured Data — Organization ──────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "LÁBí",
        "alternateName": "Labi Africa",
        "description": "LÁBí is an indigenous African textile and fashion brand founded in Ilorin, Kwara State, Nigeria. We transform traditional Aṣọ-Òkè and African textiles into modern everyday wearable pieces.",
        "url": "https://labiafrica.com",
        "logo": "https://labiafrica.com/logo.png",
        "image": "https://labiafrica.com/og-image.jpg",
        "email": "hello@labiafrica.com",
        "foundingDate": "2020",
        "foundingLocation": {
          "@type": "Place",
          "name": "Ilorin, Kwara State, Nigeria"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ilorin",
          "addressRegion": "Kwara State",
          "addressCountry": "NG"
        },
        "sameAs": [
          "https://www.instagram.com/labiiafrica",
          "https://www.tiktok.com/@labiiafrica",
          "https://twitter.com/labiiafrica",
          "https://www.facebook.com/labiiafrica"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "LÁBí Collections",
          "itemListElement": [
            { "@type": "OfferCatalog", "name": "Aṣọ-Òkè Collection" },
            { "@type": "OfferCatalog", "name": "FÌLÁ" },
            { "@type": "OfferCatalog", "name": "Custom Orders" },
            { "@type": "OfferCatalog", "name": "Contemporary African Pieces" }
          ]
        }
      }
    </script>

    <!-- ── Structured Data — WebSite + Sitelinks Searchbox ─────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LÁBí",
        "url": "https://labiafrica.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://labiafrica.com/shop?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- ── Fonts ────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- ── Dark mode flash prevention ──────────────────────────────────────── -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
