    <!-- ── Structured Data — Organization ──────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "LÁBí",
        "alternateName": "Labi Africa",
        "description": "LÁBí is an indigenous African textile and fashion brand founded in Ilorin, Kwara State, Nigeria. We transform traditional Aṣọ-Òkè and African textiles into modern everyday wearable pieces.",
        "url": "https://labiafrica.com",
        "logo": "https://labiafrica.com/logo.png",
        "image": "https://labiafrica.com/og-image.jpg",
        "email": "hello@labiafrica.com",
        "foundingDate": "2020",
        "foundingLocation": {
          "@type": "Place",
          "name": "Ilorin, Kwara State, Nigeria"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ilorin",
          "addressRegion": "Kwara State",
          "addressCountry": "NG"
        },
        "sameAs": [
          "https://www.instagram.com/labiiafrica",
          "https://www.tiktok.com/@labiiafrica",
          "https://twitter.com/labiiafrica",
          "https://www.facebook.com/labiiafrica"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "LÁBí Collections",
          "itemListElement": [
            { "@type": "OfferCatalog", "name": "Aṣọ-Òkè Collection" },
            { "@type": "OfferCatalog", "name": "FÌLÁ" },
            { "@type": "OfferCatalog", "name": "Custom Orders" },
            { "@type": "OfferCatalog", "name": "Contemporary African Pieces" }
          ]
        }
      }
    </script>

    <!-- ── Structured Data — WebSite + Sitelinks Searchbox ─────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LÁBí",
        "url": "https://labiafrica.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://labiafrica.com/shop?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- ── Dark mode flash prevention ──────────────────────────────────────── -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <!-- ── Google Analytics 4 ─────────────────────────────────────────────── -->
    <!-- Vite replaces %VITE_GA_MEASUREMENT_ID% at build time. If the env var
         is empty the src stays blank and gtag never initialises. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      window.gtag = gtag;
      gtag("js", new Date());
      gtag("config", "%VITE_GA_MEASUREMENT_ID%", {
        send_page_view: false, // we send page_view manually on route changes
      });
    </script>
